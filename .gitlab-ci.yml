stages:
  - package
  - release

create_zip:
  stage: package
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache zip curl
  script:
    - |
      cd tts-openai
      zip -r ../tts-openai.zip plugin.json icon.png src/
      url="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/releases/${CI_COMMIT_TAG}/tts-openai.zip"
      curl --fail --show-error --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file tts-openai.zip "${url}"
  artifacts:
    paths:
      - "*.zip"
    expire_in: 1 day

publish_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: create_zip
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      file="tts-openai.zip"
      url="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/releases/${CI_COMMIT_TAG}/${file}"

      glab release create "$CI_COMMIT_TAG" \
        --name "Release ${CI_COMMIT_TAG}" \
        --notes "Release ${CI_COMMIT_TAG}" \
        --assets-links "[{\"name\":\"${file}\",\"url\":\"${url}\",\"link_type\":\"package\"}]"
