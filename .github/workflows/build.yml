name: Build extensions

on:
  release:
    types:
    - published

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          cd  tts-openai; zip -r  ../tts-openai.zip plugin.json icon.png src/; cd -
          cd chat-openai; zip -r ../chat-openai.zip plugin.json icon.png src/; cd -
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            tts-openai.zip
            chat-openai.zip
