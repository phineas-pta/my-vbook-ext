name: Build extensions

on:
  release:
    types:
    - published

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          for folder in tts-openai chat-openai; do
            (cd "${folder}" && zip -r "../${folder}.zip" plugin.json icon.png src/)
          done
      - uses: softprops/action-gh-release@v3
        with:
          files: \*.zip
